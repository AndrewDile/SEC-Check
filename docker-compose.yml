services:
  caddy:   # the only public port; see Caddyfile for which path goes where
    image: caddy:2.10
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:   # login for /logs/
      LOGS_USER: ${LOGS_USER}
      LOGS_PASSWORD_HASH: ${LOGS_PASSWORD_HASH}
    depends_on:
      - api
      - web_app
      - tester
      - logs
      - docs
    restart: unless-stopped

  logs:   # log viewer for every container, served at /logs/ behind a password (see Caddyfile)
    image: amir20/dozzle:v11.3.2
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  docs:   # developer docs (MkDocs), served at /docs/; built from docs/ and each service's OpenAPI files
    build:
      context: .
      dockerfile: docs/Dockerfile
    restart: unless-stopped

  api:
    build: ./api
    environment:
      PORT: 3001
      DB_HOST: db
      DB_NAME: seccheck
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WORKER_URL: http://ingestion-worker:8002
      NOTIFIER_URL: http://notification-service:8001
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}   # for claim links in notifications
      # Tokens the services send us, and the ones we send them
      INGEST_CORE_API_TOKEN: ${INGEST_CORE_API_TOKEN}
      INGEST_INBOUND_TOKEN: ${INGEST_INBOUND_TOKEN}
      NOTIF_CORE_API_TOKEN: ${NOTIF_CORE_API_TOKEN}
      NOTIF_INBOUND_TOKEN: ${NOTIF_INBOUND_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: seccheck
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # local tools only, never public
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d   # runs .sql on first start only
      - db-data:/var/lib/mysql
    healthcheck:   # TCP, so it only passes once init scripts are done
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  web_app:
    build: ./web_app
    environment:
      CORE_API_URL: http://api:3001
    depends_on:
      - api
    restart: unless-stopped

  tester:   # cross-team tester; inside the stack the Core API is http://api:3001
    build: ./tester
    environment:
      TESTER_PORT: 8100
    depends_on:
      - api
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: ingestion_worker/Dockerfile
    environment:
      CORE_API_URL: http://api:3001
      CORE_API_TOKEN: ${INGEST_CORE_API_TOKEN}
      INBOUND_TOKEN: ${INGEST_INBOUND_TOKEN}
      SEC_USER_AGENT: ${SEC_USER_AGENT}
    depends_on:
      - api
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    environment:
      CORE_API_URL: http://api:3001
      CORE_API_TOKEN: ${NOTIF_CORE_API_TOKEN}
      INBOUND_TOKEN: ${NOTIF_INBOUND_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
