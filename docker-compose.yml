services:
  api:
    build: ./api
    environment:
      PORT: 3001
    ports:
      - "3001:3001"

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: seccheck
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d   # runs .sql on first start only
      - db-data:/var/lib/mysql

  web_app:
    build: ./web_app
    environment:
      CORE_API_URL: http://api:3001
    ports:
      - "8000:8000"
    depends_on:
      - api

volumes:
  db-data:
