services:
  caddy:   # the only public port; see Caddyfile for which path goes where
    image: caddy:2.10
    ports:
      - "${HTTP_PORT:-80}:80"   # ./test.sh moves it, so it can run next to a dev stack
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:   # login for /logs/
      LOGS_USER: ${LOGS_USER}
      LOGS_PASSWORD_HASH: ${LOGS_PASSWORD_HASH}
    depends_on:
      - api
      - web_app
      - tester
      - logs
      - docs
    networks: [web, tester, logs, docs, tunnel]
    restart: unless-stopped

  tunnel:   # Cloudflare Tunnel: HTTPS at sec-check.andrew-dile.net, forwarded to caddy:80
    image: cloudflare/cloudflared:2026.10.7
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    profiles: [tunnel]   # server only: needs COMPOSE_PROFILES=tunnel in .env
    depends_on:
      - caddy
    networks: [tunnel]
    restart: unless-stopped

  logs:   # log viewer for every container, served at /logs/ behind a password (see Caddyfile)
    image: amir20/dozzle:v11.3.2
    environment:
      DOZZLE_BASE: /logs
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [logs]
    restart: unless-stopped

  docs:   # developer docs (MkDocs), served at /docs/; built from docs/ and each service's OpenAPI files
    build:
      context: .
      dockerfile: docs/Dockerfile
    networks: [docs]
    restart: unless-stopped

  api:
    build: ./api
    environment:
      PORT: 3001
      DB_HOST: db
      DB_NAME: seccheck
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      WORKER_URL: http://ingestion-worker:8002
      NOTIFIER_URL: http://notification-service:8001
      WEB_APP_INTERNAL_URL: http://web_app:8000   # its /coverage, for /test/report
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost}   # for claim links in notifications
      # Tokens the services send us, and the ones we send them
      INGEST_CORE_API_TOKEN: ${INGEST_CORE_API_TOKEN}
      INGEST_INBOUND_TOKEN: ${INGEST_INBOUND_TOKEN}
      NOTIF_CORE_API_TOKEN: ${NOTIF_CORE_API_TOKEN}
      NOTIF_INBOUND_TOKEN: ${NOTIF_INBOUND_TOKEN}
      WEBAPP_INBOUND_TOKEN: ${WEBAPP_INBOUND_TOKEN}
      MIGRATIONS_DIR: /migrations   # applied at startup, each once (schema_migrations)
    volumes:
      - ./db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [web, data, ingest, notify]
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: --disable-log-bin   # no replication; with binary logging, creating triggers needs SUPER
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: seccheck
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"   # local tools only, never public
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:   # TCP, so it only passes once init scripts are done
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30
    networks: [data]
    restart: unless-stopped

  web_app:
    build: ./web_app
    environment:
      CORE_API_URL: http://api:3001
      INBOUND_TOKEN: ${WEBAPP_INBOUND_TOKEN}   # the Core API's, for /coverage
    depends_on:
      - api
    networks: [web]
    restart: unless-stopped

  tester:   # cross-team tester; it reaches the system through Caddy, at http://caddy/system
    build: ./tester
    environment:
      TESTER_PORT: 8100
    depends_on:
      - api
    networks: [tester]
    restart: unless-stopped

  ingestion-worker:
    build:
      context: .
      dockerfile: ingestion_worker/Dockerfile
    environment:
      CORE_API_URL: http://api:3001
      CORE_API_TOKEN: ${INGEST_CORE_API_TOKEN}
      INBOUND_TOKEN: ${INGEST_INBOUND_TOKEN}
      SEC_USER_AGENT: ${SEC_USER_AGENT}
    depends_on:
      - api
    healthcheck:   # its event API accepts connections; it has no health route
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8002), 2)"]
      interval: 10s
      retries: 6
    networks: [ingest]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    environment:
      CORE_API_URL: http://api:3001
      CORE_API_TOKEN: ${NOTIF_CORE_API_TOKEN}
      INBOUND_TOKEN: ${NOTIF_INBOUND_TOKEN}
      # Email; with SMTP_HOST empty, email notices fail as not set up. Slack and Teams need nothing here.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/healthz', timeout=2)"]
      interval: 10s
      retries: 6
    networks: [notify]
    restart: unless-stopped

# One network per connection in architecture/model.yaml, so containers reach only what they talk to.
# ./verify.sh checks this against the model: change the model first.
networks:
  web:      # Caddy, web app and Core API
  tester:   # Caddy and tester
  logs:     # Caddy and log viewer
  docs:     # Caddy and docs
  tunnel:   # Cloudflare Tunnel and Caddy
  data:     # Core API and MySQL
  ingest:   # Core API and ingestion worker
  notify:   # Core API and notification service

volumes:
  db-data:
  caddy-data:
