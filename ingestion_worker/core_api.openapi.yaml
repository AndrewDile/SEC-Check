# What the ingestion worker needs from the Core API. After changing it, run generate_models.sh.
openapi: 3.1.0
info:
  title: Core API (ingestion worker's needs)
  version: 0.1.0
  description: |
    The Core API endpoints the ingestion worker calls, and the payloads it exchanges with the
    Core API. The Core API service aggregates this with every other service's needs.

    Services never call each other. The Core API calls the worker through the worker's own
    API (openapi.yaml), whose payloads are defined here.

servers:
  - url: http://localhost:8000
    description: Local development (the worker's default `CORE_API_URL`)

security:
  - bearerAuth: []

tags:
  - name: Ingestion worker

paths:
  /ingest/dependencies:
    get:
      operationId: listDependencies
      summary: List every software dependency of every company
      description: |
        Called when the worker starts (and on later polls, until it succeeds) to load every
        dependency. After that, the Core API keeps the worker's copy up to date through the
        worker's API. Returns everything in one response.
      tags: [Ingestion worker]
      responses:
        "200":
          description: All dependencies.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dependency" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /ingest/incidents:
    post:
      operationId: createIncident
      summary: Report a possible incident for one company
      description: |
        `(company_id, source, external_id)` is unique: reporting an incident the Core API
        already has returns the stored one with `200` instead of creating a duplicate.
        The worker relies on this, because every poll re-reports everything in its
        lookback window.

        When it creates a new incident, the Core API notifies the company's teams itself.
      tags: [Ingestion worker]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreate" }
      responses:
        "201":
          description: A new incident was created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "200":
          description: The incident was already reported. This is the stored one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The static token in the worker's `CORE_API_TOKEN`.

  responses:
    Unauthorized:
      description: The bearer token is missing or wrong.

  schemas:
    # Dependencies ----------------------------------------------------------

    Dependency:
      description: A piece of software a company has told us it uses.
      type: object
      required: [id, company_id, vendor, product]
      properties:
        id: { type: string }
        company_id: { type: string }
        vendor: { type: string }
        product: { type: string }
        version: { type: [string, "null"] }
        cpe:
          type: [string, "null"]
          description: Not used for matching yet. For future sources like NVD.
        purl:
          type: [string, "null"]
          description: Not used for matching yet. For future sources like OSV.
        vendor_cik:
          type: [string, "null"]
          description: The vendor's SEC CIK, if it is a public company.

    # Incidents. Other services' needs may define these too; once aggregated, they must agree.

    SourceName:
      type: string
      enum: [cisa_kev, sec_edgar_8k]

    Priority:
      type: string
      enum: [critical, high, medium, low]

    Confidence:
      type: string
      enum: [high, medium]

    MatchedDependency:
      description: One of the company's dependencies that an incident may affect, and why we think so.
      type: object
      required: [dependency_id, vendor, product, confidence, reason]
      properties:
        dependency_id: { type: string }
        vendor: { type: string }
        product: { type: string }
        version: { type: [string, "null"] }
        confidence: { $ref: "#/components/schemas/Confidence" }
        reason: { type: string }

    IncidentCreate:
      description: A possible incident for one company, found by the ingestion worker.
      type: object
      required:
        - company_id
        - source
        - external_id
        - title
        - summary
        - source_url
        - published_at
        - detected_at
        - priority_hint
        - matched_dependencies
      properties:
        company_id: { type: string }
        source: { $ref: "#/components/schemas/SourceName" }
        external_id:
          type: string
          description: "The source's own ID: a CVE ID, an SEC accession number, ..."
        title: { type: string }
        summary: { type: string }
        source_url: { type: string, format: uri }
        published_at:
          type: string
          format: date-time
          description: When the source published it.
        detected_at:
          type: string
          format: date-time
          description: When we matched it, for the audit trail.
        priority_hint:
          $ref: "#/components/schemas/Priority"
          description: A hint for sorting only. Whether an incident is material is for the company to decide.
        matched_dependencies:
          type: array
          items: { $ref: "#/components/schemas/MatchedDependency" }
        details:
          type: object
          default: {}
          description: Source-specific extras.

    Incident:
      description: An incident as the Core API stores it.
      allOf:
        - $ref: "#/components/schemas/IncidentCreate"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
