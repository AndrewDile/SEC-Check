# The notification service's API. Only the Core API calls it. Payloads are in core_api.openapi.yaml.
openapi: 3.1.0
info:
  title: Notification service API
  version: 0.1.0
  description: How the Core API hands notifications to the notification service. Only the Core API calls it.

servers:
  - url: http://localhost:8001
    description: Local development (the notifier's default `PORT`)

security:
  - bearerAuth: []

paths:
  /notifications:
    post:
      operationId: sendNotification
      summary: Hand over a notification
      description: |
        The Core API calls this when it creates an incident or adds newly matched dependencies to
        one, and retries until it gets
        `202`, which is safe because repeating a `notification_id` is a no-op. The
        notification service answers right away, delivers afterwards, and then reports the
        results to the Core API (`reportNotificationResults`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "core_api.openapi.yaml#/components/schemas/NotificationRequest" }
      responses:
        "202":
          description: Accepted. Delivery happens after the response.
          content:
            application/json:
              schema:
                type: object
                required: [notification_id]
                properties:
                  notification_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /coverage/snapshot:
    post:
      operationId: snapshotCoverage
      summary: Start counting lines for a test session
      description: The Core API calls this at `/test/setup`.
      responses:
        "200":
          description: The generation to pass to `/coverage` as `since`.
          content:
            application/json:
              schema:
                type: object
                required: [since]
                properties:
                  since: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /coverage:
    get:
      operationId: getCoverage
      summary: Lines that ran since a snapshot
      description: The Core API calls this at `/test/report`, and adds the counts to its own.
      parameters:
        - { name: since, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Lines inside the notifier's functions, and how many of them ran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
        "400":
          description: "`since` is missing or not a whole number."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: The notifier restarted since that snapshot, so the lines are lost.

components:
  schemas:
    Coverage:
      type: object
      required: [covered, total, enabled, started]
      properties:
        covered: { type: integer }
        total: { type: integer }
        enabled: { type: boolean, description: "false when `CODE_COVERAGE=off`" }
        started: { type: number, description: "When the notifier began counting, Unix time in seconds" }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The static token in the notifier's `INBOUND_TOKEN`. Only the Core API has it.

  responses:
    Unauthorized:
      description: The bearer token is missing or wrong.
