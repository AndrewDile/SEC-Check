<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web App API docs</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>body { margin: 0; } .note { font: 14px/1.4 system-ui, sans-serif; padding: 12px 20px; background: #f3f5f7; border-bottom: 1px solid #c9d1d9; }</style>
</head>
<body>
  <div class="note">
    Interactive docs for the Web App contract (<code>/openapi.json</code>). Sign in on the
    <a href="/app/">app</a> first; “Try it out” then sends requests as that user. Loading this page needs internet access.
  </div>
  <div id="swagger"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: "/openapi.json", dom_id: "#swagger", tryItOutEnabled: true });
  </script>
</body>
</html>
