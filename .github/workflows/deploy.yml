# Deploys main to EC2 with deploy.sh. Needs repo secrets DEPLOY_HOST (user@host) and
# DEPLOY_SSH_KEY (the private key's contents), and port 22 open to the internet.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of running two at once
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST#*@}" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: DEPLOY_KEY=$HOME/.ssh/deploy_key ./deploy.sh
