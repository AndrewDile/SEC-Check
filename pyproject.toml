[project]
name = "incident-services"
version = "0.1.0"
description = "Ingestion worker and notification service for the SEC cyber-incident project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pyflakes, core pycodestyle errors, and import sorting
select = ["E4", "E7", "E9", "F", "I"]
