# For the end-to-end tests (ingestion_worker/tests/test_e2e.py): the real worker and notifier,
# reading fake feeds, and notifying a fake mail server, Slack and Teams. The worker polls hourly, so
# what the tests see comes from its catch-up.
services:
  feed-mock:
    build:
      context: .
      dockerfile: ingestion_worker/Dockerfile
    command: ["python", "-m", "ingestion_worker.tests.mock_feeds"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8003/kev')"]
      interval: 1s
      retries: 30
    networks: [ingest]

  ingestion-worker:
    environment:
      KEV_URL: http://feed-mock:8003/kev
      EDGAR_SEARCH_URL: http://feed-mock:8003/edgar
      SEC_USER_AGENT: e2e-test
      KEV_POLL_INTERVAL_S: 3600
      EDGAR_POLL_INTERVAL_S: 3600
    depends_on:
      feed-mock:
        condition: service_healthy

  # Catches the notifier's email. The tests read it through Mailpit's API on localhost.
  mailpit:
    image: axllent/mailpit:v1.34.0
    environment:
      # A login, as a real server requires. Mailpit only offers one unencrypted if told to.
      MP_SMTP_AUTH: alerts@example.com:e2e-password
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"
    networks: [notify]

  # A fake Slack and Teams: it takes their host names on the notifier's network, so the notifier's
  # HTTPS and host checks stay on. Only the notifier trusts its certificate.
  webhook-mock:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    command: ["python", "-m", "notification_service.tests.mock_webhooks"]
    user: root   # to write the certificate to the volume
    environment:
      CERT_FILE: /certs/webhooks.pem
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8004')"]
      interval: 1s
      retries: 30
    ports:
      - "127.0.0.1:${WEBHOOK_MOCK_PORT:-18004}:8004"
    volumes:
      - webhook-certs:/certs
    networks:
      notify:
        aliases: [hooks.slack.com, e2e.environment.api.powerplatform.com]

  notification-service:
    environment:
      SSL_CERT_FILE: /certs/webhooks.pem
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURITY: none
      SMTP_USER: alerts@example.com
      SMTP_PASSWORD: e2e-password
    volumes:
      - webhook-certs:/certs:ro
    depends_on:
      mailpit:
        condition: service_healthy
      webhook-mock:
        condition: service_healthy

volumes:
  webhook-certs:
